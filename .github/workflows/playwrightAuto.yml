
name: Playwright Automation

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  test:
    name: Execute tests on machine
    runs-on: [self-hosted, Windows, X64]

    env:
      CI: "true"
      TEST_ENV: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute automation script
        shell: bash
        run: ./run.sh

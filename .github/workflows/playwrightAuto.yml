name: Playwright Automation

on:
  # push:
  #   branches:
  #     - master

  workflow_dispatch:
    inputs:
      tag:
        description: "Select the Playwright test tag"
        required: true
        type: choice
        default: "@ui"
        options:
          - "@ui"
          - "@api"
          - "@smoke"
          - "@regression"

      environment:
        description: "Select the target environment"
        required: true
        type: choice
        default: "dev"
        options:
          - "dev"
          - "qa"
          - "stage"

jobs:
  Regression-Test:
    runs-on: [self-hosted, Windows, X64]

    env:
      TEST_ENV: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display execution configuration
        shell: bash
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Environment: $TEST_ENV"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Clean previous reports and results
        shell: bash
        run: |
          rm -rf allure-results allure-report playwright-report

      - name: Run UI tests on push
        if: github.event_name == 'push'
        shell: bash
        env:
          TEST_ENV: dev
        run: npx playwright test --grep "@ui"

      - name: Run API tests on push
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          TEST_ENV: api
        run: npx playwright test --grep "@api"

      - name: Run selected tests manually
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TEST_ENV: ${{ inputs.environment }}
        run: npx playwright test --grep "${{ inputs.tag }}"

      - name: Generate Allure report
        if: always()
        shell: bash
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate ./allure-results --output ./allure-report
          else
            echo "No Allure results were generated."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 7
